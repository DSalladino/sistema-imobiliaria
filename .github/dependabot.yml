version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
    ignore:
      # O xlsx é publicado fora do npm (cdn.sheetjs.com); atualizações são manuais.
      - dependency-name: xlsx

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
