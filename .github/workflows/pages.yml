name: Publicar demonstração

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A base de demonstração é relativa à data atual. O redeploy semanal mantém
  # os meses, vencimentos e indicadores coerentes para quem abrir o link.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Demo estática · GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar ambiente
        run: npm run check

      - name: Gerar retrato da demonstração
        run: npm run demo:estatico
        env:
          DEMO_SENHA: Demo#2026

      - name: Montar artefato estático
        run: |
          mkdir -p _site
          cp -r public/. _site/
          touch _site/.nojekyll
          ls -lh _site/demo-data.json

      - name: Configurar Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
